<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zähler">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <title>{% block title %}Zählerstand Erfassung{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Touch optimization and mobile font defaults */
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom scrollbar and subtle transitions */
        .step-transition {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-brand-600 selection:text-white">
    <div class="flex-1 flex flex-col max-w-lg mx-auto w-full p-4 pb-8 sm:p-6">
        <!-- App Header -->
        <header class="flex items-center justify-between py-3 mb-4 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center text-brand-400 font-bold text-xl shadow-inner">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-100 tracking-tight leading-none">Zählerstand Erfassung</h1>
                    <span class="text-xs text-slate-400">Monatlicher Foto-Wizard</span>
                </div>
            </div>
            <nav class="flex items-center space-x-1.5">
                <a href="/wizard" class="text-xs px-3 py-1.5 rounded-lg border transition font-medium {% if request.url.path == '/wizard' or request.url.path == '/' %}bg-brand-600 border-brand-500 text-white{% else %}bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700{% endif %}">
                    Ablesung
                </a>
                <a href="/zaehler" class="text-xs px-3 py-1.5 rounded-lg border transition font-medium {% if request.url.path.startswith('/zaehler') %}bg-brand-600 border-brand-500 text-white{% else %}bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700{% endif %}">
                    Zähler
                </a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then((registration) => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                    })
                    .catch((err) => {
                        console.warn('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
